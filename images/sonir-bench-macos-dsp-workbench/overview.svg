<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- 生成物。直すときは同じ名前の .diagram.mjs を直して make writing-diagrams -->
  <rect width="1200" height="660" fill="#ffffff"/>
  <rect x="40" y="220" width="1120" height="250" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="60" y="252" font-size="20" font-weight="700" fill="#0f172a">daemon (Rust, headless)</text>
  <rect x="40" y="40" width="300" height="84" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="190" y="77" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Any app</text>
  <text x="190" y="103" text-anchor="middle" font-size="15" fill="#475569">Spotify / Apple Music / Qobuz / browser</text>
  <rect x="440" y="40" width="360" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="620" y="77" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Sonir Bench virtual device</text>
  <text x="620" y="103" text-anchor="middle" font-size="15" fill="#475569">AudioServerPlugIn in coreaudiod · unity volume</text>
  <rect x="60" y="276" width="170" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="145" y="315" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Entry monitor</text>
  <text x="145" y="341" text-anchor="middle" font-size="15" fill="#475569">bit depth / on-grid</text>
  <text x="145" y="363" text-anchor="middle" font-size="15" fill="#475569">per 1 s window</text>
  <rect x="260" y="276" width="170" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="345" y="315" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Upsample 16×</text>
  <text x="345" y="341" text-anchor="middle" font-size="15" fill="#475569">to 705.6k / 768k</text>
  <text x="345" y="363" text-anchor="middle" font-size="15" fill="#475569">f32 → f64</text>
  <rect x="460" y="276" width="220" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="315" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Your graph</text>
  <text x="570" y="341" text-anchor="middle" font-size="15" fill="#475569">A / B, gapless switch</text>
  <text x="570" y="363" text-anchor="middle" font-size="15" fill="#475569">validated before it plays</text>
  <rect x="710" y="276" width="190" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="805" y="315" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Exit rate</text>
  <text x="805" y="341" text-anchor="middle" font-size="15" fill="#475569">down or up to</text>
  <text x="805" y="363" text-anchor="middle" font-size="15" fill="#475569">what the DAC takes</text>
  <rect x="930" y="276" width="210" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="1035" y="315" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Output stage</text>
  <text x="1035" y="341" text-anchor="middle" font-size="15" fill="#475569">true-peak metering</text>
  <text x="1035" y="363" text-anchor="middle" font-size="15" fill="#475569">changes nothing by default</text>
  <rect x="40" y="556" width="300" height="84" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="190" y="593" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">UI (Tauri + React)</text>
  <text x="190" y="619" text-anchor="middle" font-size="15" fill="#475569">separate process</text>
  <rect x="930" y="556" width="210" height="84" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="1035" y="593" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">DAC</text>
  <text x="1035" y="619" text-anchor="middle" font-size="15" fill="#475569">PCM, or DSD over DoP</text>
  <path d="M 346 82 L 422 82" fill="none" stroke="#334155" stroke-width="2"/>
  <polygon points="434,82 422,88 422,76" fill="#334155"/>
  <path d="M 620 130 L 620 202" fill="none" stroke="#334155" stroke-width="2"/>
  <polygon points="620,214 614,202 626,202" fill="#334155"/>
  <path d="M 236 331 L 242 331" fill="none" stroke="#334155" stroke-width="2"/>
  <polygon points="254,331 242,337 242,325" fill="#334155"/>
  <path d="M 436 331 L 442 331" fill="none" stroke="#334155" stroke-width="2"/>
  <polygon points="454,331 442,337 442,325" fill="#334155"/>
  <path d="M 686 331 L 692 331" fill="none" stroke="#334155" stroke-width="2"/>
  <polygon points="704,331 692,337 692,325" fill="#334155"/>
  <path d="M 906 331 L 912 331" fill="none" stroke="#334155" stroke-width="2"/>
  <polygon points="924,331 912,337 912,325" fill="#334155"/>
  <path d="M 1035 476 L 1035 538" fill="none" stroke="#334155" stroke-width="2"/>
  <polygon points="1035,550 1029,538 1041,538" fill="#334155"/>
  <path d="M 1100 214 L 1100 82 L 818 82" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
  <polygon points="806,82 818,76 818,88" fill="#2563eb"/>
  <path d="M 190 538 L 190 488" fill="none" stroke="#334155" stroke-width="2"/>
  <polygon points="190,476 196,488 184,488" fill="#334155"/>
  <polygon points="190,550 184,538 196,538" fill="#334155"/>
  <text x="634" y="180" text-anchor="start" font-size="14" fill="#475569">opened as a normal input device</text>
  <text x="60" y="440" text-anchor="start" font-size="14" fill="#475569">Resampling filters are user-designed and run as partitioned FFT convolution.</text>
  <text x="1086" y="150" text-anchor="end" font-size="14" fill="#2563eb">exit clock: frames the DAC took + host time</text>
  <text x="1086" y="170" text-anchor="end" font-size="14" fill="#2563eb">(shared memory, no samples)</text>
  <text x="206" y="506" text-anchor="start" font-size="14" fill="#475569">WebSocket: JSON-RPC + telemetry</text>
  <text x="206" y="526" text-anchor="start" font-size="14" fill="#475569">numbers only, never waveforms</text>
</svg>
